<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Design</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --card: rgba(255,255,255,0.03);
    --border: rgba(255,255,255,0.06);
    --text: #e8e8ed;
    --text-muted: #8888a0;
    --accent: #6c5ce7;
    --accent2: #00cec9;
    --accent3: #fd79a8;
    --accent4: #fdcb6e;
    --radius: 16px;
    --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  body {
    font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 20% 10%, rgba(108,92,231,0.12), transparent),
      radial-gradient(ellipse 60% 50% at 80% 90%, rgba(0,206,201,0.10), transparent),
      radial-gradient(ellipse 50% 40% at 50% 50%, rgba(253,121,168,0.06), transparent);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 40px 24px;
    position: relative;
    z-index: 1;
  }

  /* Code Modal */
  .code-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(8px);
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.3s, visibility 0.3s;
  }
  .code-overlay.active {
    opacity: 1;
    visibility: visible;
  }
  .code-modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px;
    max-width: 640px;
    width: 90%;
    max-height: 80vh;
    overflow-y: auto;
    position: relative;
  }
  .code-modal h3 {
    font-size: 1.1rem;
    margin-bottom: 20px;
    color: var(--text);
  }
  .code-block {
    background: #0d0d14;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
    overflow-x: auto;
  }
  .code-block .code-label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--accent2);
    margin-bottom: 10px;
  }
  .code-block pre {
    font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
    font-size: 0.8rem;
    line-height: 1.7;
    color: #cdd6f4;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .code-block pre .tag { color: #89b4fa; }
  .code-block pre .attr { color: #a6e3a1; }
  .code-block pre .val { color: #fab387; }
  .code-block pre .prop { color: #89b4fa; }
  .code-block pre .num { color: #fab387; }
  .code-block pre .sel { color: #cba6f7; }
  .code-block pre .cmt { color: #6c7086; font-style: italic; }
  .code-close {
    position: absolute;
    top: 16px;
    right: 20px;
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 1.5rem;
    cursor: pointer;
    transition: color 0.2s;
  }
  .code-close:hover { color: var(--text); }
  .btn-card { cursor: pointer; }

  header {
    text-align: center;
    padding: 80px 0 60px;
  }
  header h1 {
    font-size: clamp(2.5rem, 6vw, 4rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, var(--text) 0%, #c0c0d0 50%, var(--accent2) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  header p {
    color: var(--text-muted);
    font-size: 1.15rem;
    margin-top: 16px;
    max-width: 560px;
    margin-inline: auto;
    line-height: 1.6;
  }

  .section { margin-bottom: 72px; }
  .section-title {
    font-size: 1.25rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 28px;
    padding-left: 16px;
    position: relative;
  }
  .section-title::before {
    content: '';
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    width: 4px;
    height: 20px;
    border-radius: 2px;
    background: var(--accent);
  }

  .btn-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 24px;
  }
  .btn-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    backdrop-filter: blur(20px);
    transition: border-color var(--transition), transform var(--transition);
  }
  .btn-card:hover {
    border-color: rgba(255,255,255,0.15);
    transform: translateY(-2px);
  }
  .btn-label {
    font-size: 0.8rem;
    color: var(--text-muted);
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  /* 1. Primary Gradient */
  .btn-gradient {
    padding: 12px 32px;
    border: none;
    border-radius: 50px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    color: #fff;
    background: linear-gradient(135deg, var(--accent), #a29bfe);
    box-shadow: 0 4px 24px rgba(108,92,231,0.35);
    transition: transform var(--transition), box-shadow var(--transition);
  }
  .btn-gradient:hover {
    transform: translateY(-2px) scale(1.03);
    box-shadow: 0 8px 32px rgba(108,92,231,0.5);
  }
  .btn-gradient:active { transform: scale(0.97); }

  /* 2. Outline Ghost */
  .btn-ghost {
    padding: 12px 32px;
    border: 2px solid rgba(255,255,255,0.25);
    border-radius: 50px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    color: var(--text);
    background: transparent;
    transition: border-color var(--transition), background var(--transition), box-shadow var(--transition);
  }
  .btn-ghost:hover {
    border-color: var(--accent);
    background: rgba(108,92,231,0.1);
    box-shadow: 0 0 24px rgba(108,92,231,0.2);
  }
  .btn-ghost:active { transform: scale(0.97); }

  /* 3. Neon Glow */
  .btn-neon {
    padding: 12px 32px;
    border: 2px solid var(--accent2);
    border-radius: 50px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    color: var(--accent2);
    background: transparent;
    box-shadow: 0 0 16px rgba(0,206,201,0.3), inset 0 0 16px rgba(0,206,201,0.1);
    transition: box-shadow var(--transition), transform var(--transition);
  }
  .btn-neon:hover {
    box-shadow: 0 0 36px rgba(0,206,201,0.6), inset 0 0 24px rgba(0,206,201,0.2);
    transform: translateY(-2px);
  }
  .btn-neon:active { transform: scale(0.97); }

  /* 4. Glass */
  .btn-glass {
    padding: 12px 32px;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 50px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    color: var(--text);
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(12px);
    transition: background var(--transition), border-color var(--transition), transform var(--transition);
  }
  .btn-glass:hover {
    background: rgba(255,255,255,0.14);
    border-color: rgba(255,255,255,0.35);
    transform: translateY(-2px);
  }
  .btn-glass:active { transform: scale(0.97); }

  /* 5. Slide Reveal */
  .btn-slide {
    padding: 12px 32px;
    border: none;
    border-radius: 50px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    color: #fff;
    background: var(--accent3);
    position: relative;
    overflow: hidden;
    z-index: 0;
  }
  .btn-slide::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #e84393, #fd79a8);
    opacity: 0;
    z-index: -1;
    transition: opacity var(--transition);
  }
  .btn-slide:hover::after { opacity: 1; }
  .btn-slide:hover { transform: translateY(-2px); }
  .btn-slide:active { transform: scale(0.97); }

  /* 6. Ripple */
  .btn-ripple {
    padding: 12px 32px;
    border: none;
    border-radius: 50px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    color: #1a1a2e;
    background: var(--accent4);
    position: relative;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(253,203,110,0.3);
    transition: transform var(--transition), box-shadow var(--transition);
  }
  .btn-ripple:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 28px rgba(253,203,110,0.45);
  }
  .btn-ripple:active { transform: scale(0.97); }
  .ripple-effect {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.5);
    animation: ripple 0.6s ease-out;
    pointer-events: none;
  }
  @keyframes ripple {
    to { transform: scale(4); opacity: 0; }
  }

  /* 7. Icon */
  .btn-icon {
    width: 48px; height: 48px;
    border: 1px solid var(--border);
    border-radius: 50%;
    font-size: 1.2rem;
    cursor: pointer;
    color: var(--text);
    background: var(--card);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background var(--transition), border-color var(--transition), box-shadow var(--transition);
  }
  .btn-icon:hover {
    background: rgba(108,92,231,0.18);
    border-color: var(--accent);
    box-shadow: 0 0 20px rgba(108,92,231,0.3);
  }
  .btn-icon:active { transform: scale(0.92); }

  /* 8. 3D Press */
  .btn-3d {
    padding: 12px 32px;
    border: none;
    border-radius: 12px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    color: #fff;
    background: var(--accent);
    box-shadow: 0 6px 0 #4a3db5, 0 8px 24px rgba(108,92,231,0.3);
    transition: transform var(--transition), box-shadow var(--transition);
  }
  .btn-3d:hover { transform: translateY(-2px); }
  .btn-3d:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #4a3db5, 0 4px 12px rgba(108,92,231,0.3);
  }

  /* 9. Dashed */
  .btn-dash {
    padding: 12px 32px;
    border: 2px dashed rgba(255,255,255,0.3);
    border-radius: 50px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    color: var(--text);
    background: transparent;
    transition: border-color var(--transition), color var(--transition);
  }
  .btn-dash:hover {
    border-color: var(--accent2);
    color: var(--accent2);
  }
  .btn-dash:active { transform: scale(0.97); }

  /* 10. Shimmer */
  .btn-shimmer {
    padding: 12px 32px;
    border: none;
    border-radius: 50px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    color: #1a1a2e;
    background: linear-gradient(110deg, var(--accent4) 30%, #ffeaa7 50%, var(--accent4) 70%);
    background-size: 200% 100%;
    animation: shimmer 3s ease infinite;
    transition: transform var(--transition), box-shadow var(--transition);
  }
  .btn-shimmer:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 28px rgba(253,203,110,0.45);
  }
  .btn-shimmer:active { transform: scale(0.97); }
  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  /* ========== RESPONSIVE ========== */
  @media (max-width: 768px) {
    .container { padding: 24px 16px; }
    header { padding: 48px 0 36px; }
    .btn-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
    .btn-card { padding: 24px 16px; }
    .code-modal { padding: 24px; max-width: 95%; }
  }
  @media (max-width: 480px) {
    .btn-grid { grid-template-columns: 1fr 1fr; gap: 12px; }
    .btn-card { padding: 20px 12px; }
    header h1 { font-size: 2rem; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>Premium Design</h1>
    <p>精心打造的现代化 UI 组件库 — 点击任一按钮查看源代码</p>
  </header>

  <div class="section">
    <h2 class="section-title">按钮风格</h2>
    <div class="btn-grid">
      <div class="btn-card">
        <span class="btn-label">渐变</span>
        <button class="btn-gradient">Get Started</button>
      </div>
      <div class="btn-card">
        <span class="btn-label">描边</span>
        <button class="btn-ghost">Learn More</button>
      </div>
      <div class="btn-card">
        <span class="btn-label">霓虹</span>
        <button class="btn-neon">Connect</button>
      </div>
      <div class="btn-card">
        <span class="btn-label">玻璃</span>
        <button class="btn-glass">Explore</button>
      </div>
      <div class="btn-card">
        <span class="btn-label">滑入</span>
        <button class="btn-slide">Subscribe</button>
      </div>
      <div class="btn-card">
        <span class="btn-label">波纹</span>
        <button class="btn-ripple ripple-target">Click Me</button>
      </div>
      <div class="btn-card">
        <span class="btn-label">图标</span>
        <button class="btn-icon">→</button>
      </div>
      <div class="btn-card">
        <span class="btn-label">3D 按压</span>
        <button class="btn-3d">Press</button>
      </div>
      <div class="btn-card">
        <span class="btn-label">虚线</span>
        <button class="btn-dash">Coming Soon</button>
      </div>
      <div class="btn-card">
        <span class="btn-label">流光</span>
        <button class="btn-shimmer">Limited Offer</button>
      </div>
    </div>
  </div>
</div>

<div class="code-overlay" id="codeOverlay">
  <div class="code-modal" id="codeModal">
    <button class="code-close" id="codeClose">&times;</button>
    <h3 id="codeTitle"></h3>
    <div id="codeContent"></div>
  </div>
</div>

  <span class="prop">background</span>: <span class="val">linear-gradient(135deg, #6c5ce7, #a29bfe)</span>; <span class="cmt">/* 背景：135度渐变，从紫色到浅紫色 */</span>

<span class="sel">.btn-ghost:active</span> {

}

  },

document.querySelectorAll('.btn-card').forEach(card => {
  card.addEventListener('click', function() {
    const btn = this.querySelector('button');
    const cls = Array.from(btn.classList).find(c => codeMap[c]);
    if (!cls) return;
    const data = codeMap[cls];
    document.getElementById('codeTitle').textContent = data.title;
    document.getElementById('codeContent').innerHTML =
      '<div class="code-block"><div class="code-label">HTML</div><pre>' + data.html + '</pre></div>' +
      '<div class="code-block"><div class="code-label">CSS</div><pre>' + data.css + '</pre></div>';
    document.getElementById('codeOverlay').classList.add('active');
  });
});

document.getElementById('codeClose').addEventListener('click', () => {
  document.getElementById('codeOverlay').classList.remove('active');
});

document.getElementById('codeOverlay').addEventListener('click', function(e) {
  if (e.target === this) document.getElementById('codeOverlay').classList.remove('active');
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.getElementById('codeOverlay').classList.remove('active');
});

// Ripple effect
document.querySelectorAll('.ripple-target').forEach(btn => {
  btn.addEventListener('click', function(e) {
    const ripple = document.createElement('span');
    ripple.className = 'ripple-effect';
    const rect = this.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height);
    ripple.style.width = ripple.style.height = size + 'px';
    ripple.style.left = (e.clientX - rect.left - size/2) + 'px';
    ripple.style.top = (e.clientY - rect.top - size/2) + 'px';
    this.appendChild(ripple);
    ripple.addEventListener('animationend', () => ripple.remove());
  });
});
</script>
